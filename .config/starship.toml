format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$package\
$python\
$kubernetes\
$cmd_duration\
$line_break\
$status\
$container\
$shell\
$character"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[git_branch]
symbol = ''

[hostname]
ssh_symbol = ''

[kubernetes]
disabled = false
format = '[(ns/$namespace)]($style) '
style = 'yellow'

[python]
symbol = ''
