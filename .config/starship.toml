format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$package\
$kubernetes\
$cmd_duration\
$line_break\
$python\
$status\
$container\
$shell\
$character"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[git_branch]
symbol = ''

[hostname]
ssh_symbol = '@'
style = 'bg:#a06fd1 bold black'

[kubernetes]
disabled = false
format = '[(ns/$namespace)]($style) '
style = 'yellow'

[python]
format = "[$virtualenv]($style) "
style = "bg:#33658A"
detect_extensions = []
detect_files = []

[username]
format = '[$user]($style)'
style_user = 'bg:#a06fd1 bold black'
